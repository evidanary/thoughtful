# Nightly production database backup, committed straight back to the repo.
# Requires the repo secret FLY_API_TOKEN (`fly tokens create deploy`).
name: Backup database

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {} # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # verify.js needs better-sqlite3, which is a native addon
      - name: Install backend dependencies
        run: npm ci --omit=dev
        working-directory: backend

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Take backup
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # The workflow commits and pushes itself in the next step
          BACKUP_NO_GIT: "1"
        run: ./scripts/backup.sh

      - name: Rotate, commit and push
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add -A backups
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Back up production database ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
